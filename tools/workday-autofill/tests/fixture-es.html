<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fixture · Workday en español (layout antiguo)</title>
<!-- Variante: etiquetas en español, data-automation-id del layout antiguo
     (legalNameSection_firstName…), entradas repetibles SIN ids numerados
     (sólo títulos "Experiencia laboral 1") y botón "Agregar" sin aria-label. -->
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; }
  [data-automation-id^="formField"] { margin: 10px 0; }
  label, legend { display: block; font-weight: 600; }
  [data-automation-popup] { position: absolute; background: #fff; border: 1px solid #999; z-index: 10; }
  [role="option"], [data-automation-id="promptOption"] { padding: 3px 8px; cursor: pointer; }
  [data-automation-id="selectedItem"] { display: inline-block; background: #def; margin: 2px; padding: 2px 6px; }
  section { border: 1px solid #ccc; padding: 8px; margin: 12px 0; }
</style>
</head>
<body>
<div data-automation-id="applyFlowPage">
  <div data-automation-id="progressBarActiveStep">Mi información</div>

  <div data-automation-id="formField-how"><label for="how">¿Cómo te enteraste de nosotros? *</label>
    <button type="button" id="how" aria-haspopup="listbox" data-options="Bolsa de trabajo - OCC|Bolsa de trabajo - LinkedIn|Referido|Página de la empresa">Selecciona uno</button></div>

  <fieldset data-automation-id="formField-prev"><legend>¿Has trabajado anteriormente en Acme? *</legend>
    <label><input type="radio" name="prev" id="prev-si"> Sí</label><label><input type="radio" name="prev" id="prev-no"> No</label></fieldset>

  <div data-automation-id="formField-pais"><label for="pais">País *</label>
    <button type="button" id="pais" aria-haspopup="listbox" data-options="Estados Unidos|México|Canadá">Selecciona uno</button></div>

  <div data-automation-id="formField-n1"><label for="n1">Nombre(s) *</label><input id="n1" data-automation-id="legalNameSection_firstName"></div>
  <div data-automation-id="formField-n2"><label for="n2">Apellido paterno *</label><input id="n2" data-automation-id="legalNameSection_lastName"></div>
  <div data-automation-id="formField-n3"><label for="n3">Apellido materno</label><input id="n3" data-automation-id="legalNameSection_secondaryLastName"></div>
  <div data-automation-id="formField-a1"><label for="a1">Dirección línea 1 *</label><input id="a1" data-automation-id="addressSection_addressLine1"></div>
  <div data-automation-id="formField-a2"><label for="a2">Ciudad *</label><input id="a2" data-automation-id="addressSection_city"></div>
  <div data-automation-id="formField-a3"><label for="a3">Estado *</label>
    <button type="button" id="a3" aria-haspopup="listbox" data-options="Jalisco|Nuevo León|Puebla">Selecciona uno</button></div>
  <div data-automation-id="formField-a4"><label for="a4">Código postal *</label><input id="a4" data-automation-id="addressSection_postalCode"></div>
  <div data-automation-id="formField-e"><label for="e">Correo electrónico *</label><input id="e" data-automation-id="email"></div>
  <div data-automation-id="formField-t1"><label for="t1">Tipo de dispositivo telefónico *</label>
    <button type="button" id="t1" aria-haspopup="listbox" data-options="Casa|Móvil|Trabajo">Selecciona uno</button></div>
  <div data-automation-id="formField-t2"><label>Código de país *</label>
    <div class="prompt" data-tree="phonees"><div data-automation-id="multiselectInputContainer"><input data-automation-id="searchBox" id="t2"></div></div></div>
  <div data-automation-id="formField-t3"><label for="t3">Número de teléfono *</label><input id="t3" data-automation-id="phone-number"></div>

  <section role="group" aria-labelledby="s-exp"><h3 id="s-exp">Experiencia laboral</h3><div class="entries"></div><button type="button" data-kind="exp">Agregar</button></section>
  <section role="group" aria-labelledby="s-edu"><h3 id="s-edu">Educación</h3><div class="entries"></div><button type="button" data-kind="edu">Agregar</button></section>
  <section role="group" aria-labelledby="s-lang"><h3 id="s-lang">Idiomas</h3><div class="entries"></div><button type="button" data-kind="lang">Agregar</button></section>

  <div data-automation-id="formField-q"><label for="q">¿Eres mayor de edad? *</label>
    <button type="button" id="q" aria-haspopup="listbox" data-options="Sí|No">Selecciona uno</button></div>

  <button type="button" id="next">Siguiente</button>
</div>
<script>
  const dates = (lbl) => `<div data-automation-id="formField-d"><label>${lbl}</label><div data-automation-id="dateInputWrapper">
      <input data-automation-id="dateSectionMonth-input" placeholder="MM" size="2"><input data-automation-id="dateSectionYear-input" placeholder="AAAA" size="4"></div></div>`;
  window.FIXTURE_TEMPLATES = {
    exp: (n, i) => `<div role="group" aria-labelledby="g${n}"><h4 id="g${n}">Experiencia laboral ${i}</h4>
      <div data-automation-id="formField-1"><label for="c${n}">Cargo *</label><input id="c${n}" class="cargo"></div>
      <div data-automation-id="formField-2"><label for="m${n}">Empresa *</label><input id="m${n}" class="empresa"></div>
      <div data-automation-id="formField-3"><input type="checkbox" id="k${n}" class="actual"><label for="k${n}">Actualmente trabajo aquí</label></div>
      ${dates('Desde *')}${dates('Hasta *')}
      <div data-automation-id="formField-4"><label for="d${n}">Descripción del puesto</label><textarea id="d${n}" class="desc"></textarea></div></div>`,
    edu: (n, i) => `<div role="group" aria-labelledby="g${n}"><h4 id="g${n}">Educación ${i}</h4>
      <div data-automation-id="formField-1"><label for="u${n}">Escuela o universidad *</label><input id="u${n}" class="uni"></div>
      <div data-automation-id="formField-2"><label for="t${n}">Título *</label><button type="button" id="t${n}" class="titulo" aria-haspopup="listbox" data-options="Bachillerato|Licenciatura|Maestría">Selecciona uno</button></div>
      <div data-automation-id="formField-3"><label for="r${n}">Carrera</label><input id="r${n}" class="carrera"></div>
      <div data-automation-id="formField-4"><label for="p${n}">Promedio</label><input id="p${n}" class="prom"></div></div>`,
    lang: (n, i) => `<div role="group" aria-labelledby="g${n}"><h4 id="g${n}">Idiomas ${i}</h4>
      <div data-automation-id="formField-1"><label for="l${n}">Idioma *</label><button type="button" id="l${n}" class="idioma" aria-haspopup="listbox" data-options="Alemán|Español|Francés|Inglés">Selecciona uno</button></div>
      <div data-automation-id="formField-2"><label for="v${n}">Nivel de dominio *</label><button type="button" id="v${n}" class="nivel" aria-haspopup="listbox" data-options="Básico|Intermedio|Avanzado|Nativo">Selecciona uno</button></div></div>`,
  };
</script>
<script>window.EXTRA_TREES = { phonees: { '': ['Estados Unidos (+1)', 'México (+52)', 'Canadá (+1)'] } };</script>
<script src="fixture-widgets.js"></script>
</body>
</html>
