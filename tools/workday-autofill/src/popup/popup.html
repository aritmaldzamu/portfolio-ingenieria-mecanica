<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>⚡ Autollenado</strong>
    <span id="who" class="muted"></span>
  </header>

  <button id="fill" class="primary">Llenar esta página</button>
  <div id="result" class="result" hidden></div>

  <label class="field">Dirección a usar
    <select id="address"></select>
  </label>
  <label class="field">CV a subir
    <select id="resume"></select>
  </label>

  <label class="check"><input type="checkbox" id="overwrite"> Sobrescribir campos que ya tienen valor</label>
  <label class="check"><input type="checkbox" id="floatingButton"> Botón flotante en páginas de empleo</label>
  <label class="check"><input type="checkbox" id="autoOnStep"> Workday: llenar solo al cambiar de paso</label>
  <label class="check"><input type="checkbox" id="addCertifications"> Agregar entradas de certificaciones</label>

  <button id="export" class="secondary">📄 Descargar estructura de esta página</button>
  <footer>
    <a href="#" id="options">Perfil, CVs y respuestas</a>
    <span class="muted">Atajo: Alt+Shift+L</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
