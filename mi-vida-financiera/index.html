<!doctype html>
<html lang="es-MX" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Vida Financiera</title>
  <meta name="description" content="Dashboard personal de finanzas: cuentas, rendimientos, apartados, presupuesto y metas. Todo se queda en tu dispositivo.">
  <meta name="theme-color" content="#0a0b10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c6cff'/%3E%3Cpath d='M8 21l5-6 4 4 7-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Aplica el tema guardado antes de pintar para evitar parpadeo. */
    try {
      var pf = JSON.parse(localStorage.getItem('mvf:perfiles:v1') || 'null');
      var act = pf && pf.activo && pf.activo !== 'principal' ? ':' + pf.activo : '';
      var g = JSON.parse(localStorage.getItem('mvf:estado:v1' + act) || '{}');
      document.documentElement.setAttribute('data-theme', g.config && g.config.tema === 'claro' ? 'light' : 'dark');
    } catch (e) { /* sin acceso a localStorage: tema oscuro */ }
  </script>
</head>
<body>
  <div class="app">
    <!-- Barra lateral (escritorio) -->
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="marca" href="#/dashboard" aria-label="Ir al inicio">
        <span class="marca-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 16l4.5-5.5 3.5 3.5 6-7.5"/></svg></span>
        <span class="marca-txt">Mi Vida <b>Financiera</b></span>
      </a>
      <nav id="nav-lateral" class="nav-lateral"></nav>
      <div class="sidebar-pie" id="sidebar-pie"></div>
    </aside>

    <div class="principal">
      <header class="topbar">
        <div class="topbar-titulo">
          <h1 id="titulo">Inicio</h1>
          <p id="subtitulo" class="topbar-sub"></p>
        </div>
        <button class="comando-btn" id="btn-comando" type="button" aria-label="Registro rápido en texto">
          <span class="ico" data-ico="sparkles"></span>
          <span class="comando-btn-txt">Escribe un movimiento… <em>“gasté 350 en comida con nu”</em></span>
          <kbd>/</kbd>
        </button>
        <div class="topbar-acciones">
          <span id="aviso-respaldo"></span>
          <button class="avatar-btn" id="btn-perfil" type="button" aria-label="Cambiar de persona" title="Cambiar de persona"></button>
          <button class="btn-icono" id="btn-privado" type="button" aria-label="Ocultar montos" title="Ocultar montos"><span class="ico" data-ico="eye"></span></button>
          <button class="btn-icono" id="btn-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro"><span class="ico" data-ico="sun"></span></button>
        </div>
      </header>
      <main id="vista" class="vista" tabindex="-1"></main>
    </div>

    <!-- Barra inferior (celular) -->
    <nav class="tabbar" id="tabbar" aria-label="Navegación"></nav>
  </div>

  <div id="capa-modales"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- Librería de gráficas por CDN con versión fija; si no hay internet usa la copia local -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script>window.Chart || document.write('<script src="vendor/chart.umd.js"><\/script>');</script>

  <!-- Núcleo (sin DOM) -->
  <script src="js/finanzas.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/consejos.js"></script>
  <script src="js/demo.js"></script>
  <!-- Interfaz -->
  <script src="js/ui.js"></script>
  <script src="js/graficas.js"></script>
  <script src="js/sincronizacion.js"></script>
  <script src="js/app.js"></script>
  <script src="js/formularios.js"></script>
  <script src="js/comando.js"></script>
  <script src="js/vistas/dashboard.js"></script>
  <script src="js/vistas/cuentas.js"></script>
  <script src="js/vistas/comparador.js"></script>
  <script src="js/vistas/apartados.js"></script>
  <script src="js/vistas/movimientos.js"></script>
  <script src="js/vistas/presupuesto.js"></script>
  <script src="js/vistas/metas.js"></script>
  <script src="js/vistas/deudas.js"></script>
  <script src="js/vistas/retiro.js"></script>
  <script src="js/vistas/proyecciones.js"></script>
  <script src="js/vistas/ingresos.js"></script>
  <script src="js/vistas/calendario.js"></script>
  <script src="js/vistas/config.js"></script>
</body>
</html>
